<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=0.5, user-scalable=yes">
<title>BC Music Downloader</title>
<link rel="stylesheet" href="common.css">
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>
<body>
<button class="simple-btn" onclick="location.href='index.html'">HOME</button>
<h1>Download MP3</h1>
<div class="search-area">
  <div class="search-box">
    <input type="text" id="search" placeholder="曲名を検索..." />
  </div>
</div>
<div class="loop-area">
  <label class="loop-label">
    <input type="checkbox" id="loopToggle"> ループ再生
  </label>
  <button class="simple-btn" onclick="location.href='playlist.html'">PLAYLIST</button>
</div>
<div id="track-list"></div>
<script src="js/music-table.js"></script>
<script>
  initMusicTable({
    jsonUrl: 'https://raw.githubusercontent.com/Sugar2550/ogg-music-downloader/main/songs_mp3.json',
    hasPlaylist: true,
    tableContainerId: 'track-list'
  });
</script>
</body>
</html>
