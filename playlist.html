<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=0.3, user-scalable=yes">
<title>BC Music Downloader</title>
<link rel="stylesheet" href="common.css">
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
<style>
body { padding: 20px; }
h1 { text-align: center; }
.button-row {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 20px;
}
.table-scroll {
  overflow-x: auto;
  display: block;
  margin-top: 24px;
}
#playlist-table {
  margin: 0 auto;
}
</style>
</head>
<body>
<div class="button-row">
  <button class="simple-btn" onclick="location.href='index.html'">HOME</button>
  <button class="simple-btn" onclick="location.href='mp3.html'">MP3</button>
  <button class="simple-btn" onclick="location.href='ogg.html'">OGG</button>
</div>
<h1>プレイリスト</h1>
<div class="loop-area">
  <label class="loop-label">
    <input type="checkbox" id="loopToggle"> プレイリストをループ再生
  </label>
</div>
<div class="table-scroll">
  <table id="playlist-table">
    <thead>
      <tr>
        <th>曲名</th>
        <th>再生/停止</th>
        <th>削除</th>
      </tr>
    </thead>
    <tbody id="playlist-tbody"></tbody>
  </table>
</div>
<div style="text-align:center; margin-top:18px;">
  <button class="simple-btn" onclick="clearPlaylist()">全て削除</button>
  <button class="simple-btn" onclick="sharePlaylist()">プレイリストを共有</button>
</div>
<script src="js/playlist.js"></script>
</body>
</html>
