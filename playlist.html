<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
<title>BC Music Downloader</title>
<link rel="stylesheet" href="common.css">
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
<style>
body { padding: 20px; }
h1 { text-align: center; }
.button-row {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 20px;
}
.table-scroll {
  overflow-x: auto;
  display: block;
  margin-top: 24px;
}
#playlist-table {
  margin: 0 auto;
}

@media (max-width: 768px) {
  body { 
    padding: 12px; 
  }

  h1 { 
    font-size: 24px;
    margin-bottom: 12px;
  }

  .button-row {
    gap: 12px;
    margin-bottom: 12px;
  }

  .simple-btn {
    font-size: 13px;
    padding: 8px 14px;
  }

  .loop-label {
    font-size: 1.0em;
    padding: 8px 14px;
  }

  .loop-area {
    margin: 12px auto 12px auto;
  }

  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    display: block;
    margin-top: 12px;
    margin-bottom: 12px;
  }

  table {
    transform: scale(0.5);
    transform-origin: top left;
    width: 200%;
    margin: 0;
  }

  #playlist-table {
    margin: 0;
  }

  .playlist-controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
    margin-bottom: 12px;
    order: 3;
  }

  .playlist-controls input[type="text"] {
    font-size: 13px;
    padding: 8px;
    width: 100%;
    box-sizing: border-box;
  }

  #savedPlaylistsContainer {
    margin-top: 12px;
    margin-bottom: 12px;
    order: 2;
  }

  .saved-playlists {
    margin: 0;
  }

  .saved-playlist-item {
    padding: 6px 8px;
    flex-direction: column;
    gap: 6px;
  }

  .saved-playlist-actions {
    width: 100%;
    gap: 4px;
  }

  .saved-playlist-actions .simple-btn {
    flex: 1;
    font-size: 12px;
    padding: 6px;
  }

  body > div:last-child {
    order: 1;
  }
}
</style>
</head>
<body style="display: flex; flex-direction: column;">
<div class="button-row">
  <button class="simple-btn" onclick="location.href='index.html'">HOME</button>
  <button class="simple-btn" onclick="location.href='mp3.html'">MP3</button>
  <button class="simple-btn" onclick="location.href='ogg.html'">OGG</button>
</div>
<h1>プレイリスト</h1>
<div class="loop-area">
  <label class="loop-label">
    <input type="checkbox" id="loopToggle"> プレイリストをループ再生
  </label>
</div>
<div class="table-scroll">
  <table id="playlist-table">
    <thead>
      <tr>
        <th>曲名</th>
        <th>再生/停止</th>
        <th>削除</th>
      </tr>
    </thead>
    <tbody id="playlist-tbody"></tbody>
  </table>
</div>

<div style="text-align:center; margin-top:18px;">
  <button class="simple-btn" onclick="clearPlaylist()">全て削除</button>
  <button class="simple-btn" onclick="sharePlaylist()">プレイリストを共有</button>
</div>

<div class="playlist-controls">
  <input type="text" id="playlistNameInput" placeholder="プレイリスト名を入力...">
  <button class="simple-btn" onclick="savePlaylistWithName()">保存</button>
</div>

<div id="savedPlaylistsContainer"></div>

<script src="js/playlist.js"></script>
</body>
</html>
